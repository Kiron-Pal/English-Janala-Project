<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- title and logo -->
    <title>English Janala | Best Place For Improve</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon" />

    <!-- font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- tailwind and daisyui cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header Section -->
    <header class="w-full">
      <!-- Navbar section -->
      <nav class="navbar w-full bg-blue-100 shadow-sm px-4">
        
        <!-- Navbar Start (Mobile Menu + Logo) -->
        <div class="navbar-start gap-2 ">
          <!-- Mobile Dropdown -->
          <div class="dropdown lg:hidden">
            <div tabindex="0" role="button" class="btn btn-ghost">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h8m-8 6h16"
                />
              </svg>
            </div>
            
            <ul
              tabindex="0"
              class="menu menu-sm dropdown-content bg-base-100 rounded-box z-50 mt-3 w-52 p-2 shadow flex flex-col gap-2"
            >
              <li>
                <a class="flex items-center gap-2">
                  <i class="fa-solid fa-circle-question"></i>FAQ
                </a>
              </li>
              <li>
                <a class="flex items-center gap-2">
                  <i class="fa-solid fa-book-open"></i>LEARN
                </a>
              </li>
              <li>
                <button class="flex items-center gap-2 text-error">
                  <i class="fa-solid fa-arrow-right-from-bracket"></i>LOG OUT
                </button>
              </li>
            </ul>
          </div>

          <!-- Logo -->
          <div class="btn btn-ghost text-xl flex items-center  gap-2 normal-case">
            <img src="assets/logo.png" alt="Logo" class="h-8 w-auto" />
            <span>English Janala</span>
          </div>
          
        </div>

        <!-- Navbar End (Desktop Navigation) -->
        <div class="navbar-end hidden lg:flex gap-2">
          <a class="btn btn-outline btn-primary">
            <i class="fa-solid fa-circle-question"></i>FAQ
          </a>
          <a class="btn btn-outline btn-primary">
            <i class="fa-solid fa-book-open"></i>LEARN
          </a>
          <button class="btn btn-outline btn-primary">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>LOG OUT
          </button>
        </div>

      </nav>
    </header>

    <section class="flex  gap-10 justify-between
    items-center py-5 w-11/12 mx-auto">
      <div class="content flex-1 text-center md:text-left">
        <h2 class="text-4xl font-bold mb-8"> <span class="text-[#00BCFF]">English</span> Is Easy
        </h2>
        <p class="font-bangla  leading-[28px] max-w-[550px] w-full "> আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা আপনার দক্ষতা বাড়াতে চান, আমাদের Interactive Lessons আপনাকে নিয়ে যাবে অন্য একটি Level এ</p>

        <div class="form  max-w-[320px] w-full mt-8 mx-auto lg:mx-0  ">
        <fieldset class="fieldset">
          
          <input type="email" class="input" placeholder="Enter Your Name" />
          
          <input type="password" class="input mt-5" placeholder="Password" />
          
          <button class="btn text-white mt-4 w-[200px] bg-[#422AD5] border-none rounded-lg sm:flex justify-center mx-auto">Get Started</button>
        </fieldset>
      </div>
      </div>





      <div class="image flex-1 hidden md:flex">
        <img src="./assets/hero-student.png" alt="">
      </div>

      
    </section>

    <section>
      <h2 class="text-4xl font-bold mb-8">
        <span class="text-[#00BCFF]">Let's</span>Learn Vocabularies</h2>

        <div id="lesson-cointainer">

        </div>
    </section>
    <script src="./script/index.js"></script>
  </body>
</html>
